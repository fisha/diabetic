# Curated authoritative sources for the companion evaluation track (handoff brief section 10).
#
# What this list is for: reviewers write and check clinical evaluation cases against these sources, and any future
# retrieval experiment may only draw from entries with use = "retrieval-candidate" AND rights_status = "cleared".
# Nothing here is shown to users, and no entry is cleared yet.
#
# Fields
#   population   who the content is written for. The companion's scope is adult + t1d; entries that are only
#                pediatric, t2d or gestational are kept as "out-of-scope" so a reviewer can see why they are excluded.
#   checked      what was confirmed and when. "bibliographic 2026-11-11" means title, publisher, date and URL were seen
#                on the publisher or an index page on that day. It does NOT mean the content was read or reviewed.
#   rights_status  "unverified" until someone reads the publisher's licence terms for our use; then "cleared" or
#                "cite-only" (may be cited and linked, not reproduced or used for retrieval).
#   attribution  how to credit the source if it is ever quoted.

[[source]]
id = "ada-soc-2026"
title = "Standards of Care in Diabetes—2026"
publisher = "American Diabetes Association (Diabetes Care, Vol. 49, Supplement 1)"
published = "2025-12 (released December 2025 for 2026)"
url = "https://diabetesjournals.org/care/issue/49/Supplement_1"
population = ["adult", "pediatric", "t1d", "t2d", "gestational"]
topics = ["glycemic goals", "diabetes technology", "hypoglycemia", "nutrition", "self-management education"]
languages = ["en"]
use = "reviewer-reference"
note = "Mixed populations: only sections or recommendations marked for adults with type 1 apply. Updated yearly; pin the year."
rights_status = "unverified"
rights_note = "ADA copyright. Free to read online; reuse beyond citation is expected to need ADA permission. To verify."
attribution = "American Diabetes Association Professional Practice Committee. Standards of Care in Diabetes—2026. Diabetes Care 2026;49(Suppl 1)."
checked = "bibliographic 2026-11-11 (ADA press release, December 2025)"

[[source]]
id = "ada-easd-t1d-adults-2021"
title = "The management of type 1 diabetes in adults. A consensus report by the ADA and the EASD"
publisher = "Diabetes Care 2021;44(11):2589–2625 and Diabetologia 2021;64:2609–2652"
published = "2021-09/10"
url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC8481000/"
identifiers = { pmid = "34590174" }
population = ["adult", "t1d"]
topics = ["glucose monitoring", "insulin therapy concepts", "hypoglycemia", "psychosocial care", "education", "technology"]
languages = ["en"]
use = "reviewer-reference"
note = "The closest match to the product's scope (adults with type 1). An updated consensus may exist; check before relying on it."
rights_status = "unverified"
rights_note = "Published in two journals; the licence of each version (ADA copyright vs. Springer open access) must be read before any reuse."
attribution = "Holt RIG, DeVries JH, Hess-Fischl A, et al. The management of type 1 diabetes in adults. Diabetes Care 2021;44:2589–2625."
checked = "bibliographic 2026-11-11 (PubMed/PMC index)"

